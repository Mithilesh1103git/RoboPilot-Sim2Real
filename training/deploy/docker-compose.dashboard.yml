services:
  robopilot-training-dashboard:
    build:
      context: ../..
      dockerfile: training/deploy/Dockerfile.dashboard
    image: robopilot-training-dashboard:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRAINING_PORT:-8010}:8010"
    volumes:
      - ../datasets:/workspace/training/datasets
      - ../runs:/workspace/training/runs
      - ../rl/checkpoints:/workspace/training/rl/checkpoints
    environment:
      PYTHONUNBUFFERED: "1"
