services:
  robopilot-training:
    build:
      context: ../..
      dockerfile: training/deploy/Dockerfile
    image: robopilot-sim2real-training:latest
    container_name: robopilot-training
    restart: unless-stopped
    ports:
      - "${TRAINING_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set OBJECT_STORAGE_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-eu-north1}
      BUFFER_WATCH_PREFIX: ${BUFFER_WATCH_PREFIX:-}
      BUFFER_POLL_SECONDS: ${BUFFER_POLL_SECONDS:-60}
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
